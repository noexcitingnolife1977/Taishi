<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI勉強会 | 社内イベント告知</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="hero__overlay">
          <div class="hero__content">
            <span class="hero__badge">AI Study Session 2024</span>
            <h1>社内AI勉強会</h1>
            <p>
              最新トレンドを共有しながら、実務に役立つAI活用のヒントを学ぶライトな勉強会です。
              はじめての方も安心して参加できる内容です。
            </p>
          </div>
        </div>
      </section>

      <section class="info">
        <div class="info__header">
          <h2>開催概要</h2>
          <p>業務に活かせるAIスキルを、気軽に学べる社内イベント。</p>
        </div>
        <div class="info__grid">
          <article class="info__card">
            <span class="info__label">タイトル</span>
            <p class="info__value">生成AIと仕事の未来 〜明日から使える実践Tips〜</p>
          </article>
          <article class="info__card">
            <span class="info__label">開催日時</span>
            <p class="info__value">2024年11月12日（火） 18:30 - 20:00</p>
          </article>
          <article class="info__card">
            <span class="info__label">場所</span>
            <p class="info__value">本社 8F コミュニティラウンジ / オンライン同時配信</p>
          </article>
        </div>
        <div class="info__cta">
          <button type="button">参加登録はこちら</button>
          <span>気軽に質問OK。先着50名</span>
        </div>
      </section>
    </main>
  </body>
</html>
